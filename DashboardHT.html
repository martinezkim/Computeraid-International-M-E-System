<div class="page-header animate-float-up">
  <div>
    <h4>Dashboard</h4>
    <p>A quick pulse on your M&amp;E system</p>
  </div>
</div>

<div class="stat-grid">

  <div class="stat-tile animate-float-up" style="animation-delay:.05s; background: linear-gradient(135deg,#feca38,#ffdd6b);">
    <span class="stat-icon"><i class="bi bi-flag-fill"></i></span>
    <div>
      <div class="stat-value" id="stat-total-countries">0</div>
      <div class="stat-label">Countries</div>
    </div>
    <div class="stat-glow"></div>
  </div>

  <div class="stat-tile animate-float-up" style="animation-delay:.12s; background: linear-gradient(135deg,#12172b,#2d3556);">
    <span class="stat-icon"><i class="bi bi-geo-alt-fill"></i></span>
    <div>
      <div class="stat-value" id="stat-total-hubs">0</div>
      <div class="stat-label">Hubs</div>
    </div>
    <div class="stat-glow"></div>
  </div>

  <div class="stat-tile animate-float-up" style="animation-delay:.19s; background: linear-gradient(135deg,#e0ac1f,#feca38);">
    <span class="stat-icon"><i class="bi bi-person-badge-fill"></i></span>
    <div>
      <div class="stat-value" id="stat-total-managers">0</div>
      <div class="stat-label">Hub Managers</div>
    </div>
    <div class="stat-glow"></div>
  </div>

  <div class="stat-tile animate-float-up" style="animation-delay:.26s; background: linear-gradient(135deg,#1c2340,#3b4570);">
    <span class="stat-icon"><i class="bi bi-kanban-fill"></i></span>
    <div>
      <div class="stat-value" id="stat-total-projects">0</div>
      <div class="stat-label">Projects <span id="stat-projects-year" class="stat-year-tag"></span></div>
    </div>
    <div class="stat-glow"></div>
  </div>

  <div class="stat-tile animate-float-up" style="animation-delay:.33s; background: linear-gradient(135deg,#b8790a,#e0ac1f);">
    <span class="stat-icon"><i class="bi bi-people-fill"></i></span>
    <div>
      <div class="stat-value" id="stat-total-beneficiaries">0</div>
      <div class="stat-label">Active Users <span id="stat-beneficiaries-year" class="stat-year-tag"></span></div>
    </div>
    <div class="stat-glow"></div>
  </div>

  <div class="stat-tile animate-float-up" style="animation-delay:.40s; background: linear-gradient(135deg,#2d3556,#4a5580);">
    <span class="stat-icon"><i class="bi bi-pc-display"></i></span>
    <div>
      <div class="stat-value" id="stat-computer-usage">0%</div>
      <div class="stat-label">Computer Usage <span class="stat-year-tag">(this month)</span></div>
    </div>
    <div class="stat-glow"></div>
  </div>

  <div class="stat-tile animate-float-up" style="animation-delay:.47s; background: linear-gradient(135deg,#6b7290,#8a90ac);">
    <span class="stat-icon"><i class="bi bi-box-seam-fill"></i></span>
    <div>
      <div class="stat-value" id="stat-total-assets">0</div>
      <div class="stat-label">Total Assets</div>
    </div>
    <div class="stat-glow"></div>
  </div>

</div>
