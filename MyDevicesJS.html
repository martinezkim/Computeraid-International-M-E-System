<script>
(function () {
  document.addEventListener('page:loaded', function (e) {
    if (e.detail.page !== 'mydevices') return;
    if (!window.MNE_CURRENT_USER || window.MNE_CURRENT_USER.role !== 'HubManager') return;
    fetchPending_();
    fetchConnected_();
  });

  function token() { return localStorage.getItem(MNE_SESSION_KEY); }

  function fetchPending_() {
    var tbody = document.getElementById('pending-devices-table-body');
    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Loading…</td></tr>';
    runServer('getPendingDeviceRequestsForMyHub', token()).then(function (res) {
      if (!res.success) { tbody.innerHTML = '<tr><td colspan="4" class="text-danger text-center py-4">' + escapeHtml(res.message) + '</td></tr>'; return; }
      if (!res.data.length) { tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">No pending requests.</td></tr>'; return; }
      tbody.innerHTML = res.data.map(function (r) {
        return '<tr>' +
          '<td class="fw-medium">' + escapeHtml(r.DeviceLabel) + '</td>' +
          '<td>' + new Date(r.DateCreated).toLocaleString() + '</td>' +
          '<td>' + new Date(r.ExpiresAt).toLocaleString() + '</td>' +
          '<td class="text-end"><button class="btn btn-sm btn-primary" onclick="MyDevices.review(\'' + r.RequestID + '\')">Review</button></td>' +
        '</tr>';
      }).join('');
    });
  }

  function fetchConnected_() {
    var tbody = document.getElementById('connected-devices-table-body');
    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Loading…</td></tr>';
    runServer('getMyHubSyncDevices', token()).then(function (res) {
      if (!res.success) { tbody.innerHTML = '<tr><td colspan="4" class="text-danger text-center py-4">' + escapeHtml(res.message) + '</td></tr>'; return; }
      if (!res.data.length) { tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">No devices connected yet.</td></tr>'; return; }
      tbody.innerHTML = res.data.map(function (d) {
        var active = d.Active === true || d.Active === 'true';
        return '<tr>' +
          '<td class="fw-medium">' + escapeHtml(d.DeviceLabel) + '</td>' +
          '<td><span class="badge ' + (active ? 'badge-active' : 'badge-inactive') + '">' + (active ? 'Active' : 'Inactive') + '</span></td>' +
          '<td>' + (d.LastSyncAt ? new Date(d.LastSyncAt).toLocaleString() : 'Never') + '</td>' +
          '<td class="text-end"><button class="btn btn-sm btn-light" onclick="MyDevices.toggleActive(\'' + d.DeviceID + '\', ' + !active + ')">' + (active ? 'Deactivate' : 'Activate') + '</button></td>' +
        '</tr>';
      }).join('');
    });
  }

  window.MyDevices = {
    review: function (requestId) {
      if (window.DeviceRequests) window.DeviceRequests.openApprovalModal(requestId);
    },
    toggleActive: function (deviceId, newActive) {
      runServer('setMyHubDeviceActive', token(), deviceId, newActive).then(function (res) {
        if (!res.success) { showToast(res.message, 'danger'); return; }
        showToast('Updated.', 'success');
        fetchConnected_();
      });
    },
    refresh: function () { fetchPending_(); fetchConnected_(); }
  };
})();
</script>
