<div class="page-header">
  <div>
    <h4>Computer Usage</h4>
    <p>Sessions are started by beneficiaries themselves, on the PC or tablet — this view is for monitoring and end-of-day cleanup</p>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-light" id="btn-manual-session"><i class="bi bi-pencil-square"></i> Manual Entry</button>
  </div>
</div>

<div class="card-surface mb-3">
  <h6 class="mb-3">Computers</h6>
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>Computer</th><th>Item</th><th>Status</th><th class="text-end">Action</th></tr></thead>
      <tbody id="computers-table-body"><tr><td colspan="4" class="text-center text-muted py-4">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="card-surface">
  <h6 class="mb-3">Recent Sessions</h6>
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>Computer</th><th>Beneficiary</th><th>Login</th><th>Logout</th><th>Duration</th><th>Status</th></tr></thead>
      <tbody id="sessions-table-body"><tr><td colspan="6" class="text-center text-muted py-4">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="d-flex justify-content-between align-items-center mt-2">
    <small class="text-muted" id="sessions-summary"></small>
    <div id="sessions-pagination"></div>
  </div>
</div>

<!-- Manual Session Entry Modal -->
<div class="modal fade" id="manualSessionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="manual-session-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Log a Computer Session</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Computer</label>
            <select class="form-select" id="manual-computer" required></select>
          </div>
          <div class="mb-2">
            <label class="form-label">Beneficiary</label>
            <div class="input-group">
              <input type="text" class="form-control" id="manual-beneficiary-search" placeholder="Search by first name…">
              <button type="button" class="btn btn-light" id="btn-manual-find">Search</button>
            </div>
            <div id="manual-beneficiary-results" class="mt-2"></div>
            <input type="hidden" id="manual-beneficiary-id">
            <div class="mt-2 small mb-2" id="manual-beneficiary-selected"></div>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="manual-date" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">Login Time</label>
              <input type="time" class="form-control" id="manual-login" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">Logout Time</label>
              <input type="time" class="form-control" id="manual-logout" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="manual-session-save-btn">Save Session</button>
        </div>
      </form>
    </div>
  </div>
</div>
