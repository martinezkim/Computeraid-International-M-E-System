<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <?!= include('Styles'); ?>
  <style>
    .auth-shell {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #1c2340, #12172b 65%); padding: 1.5rem;
    }
    .auth-card {
      width: 100%; max-width: 400px; background: #fff; border-radius: 18px;
      padding: 2.25rem 2rem; box-shadow: 0 24px 48px -12px rgba(0,0,0,.45);
    }
    .auth-brand {
      display: flex; align-items: center; margin-bottom: 1.75rem;
      background: var(--sidebar-bg, #12172b);
      border-radius: 12px;
      padding: 1rem 1.25rem;
    }
    .auth-brand .brand-logo-svg { width: 170px; height: auto; display: block; }
    .role-tabs {
      display: flex; background: var(--bg-body, #f4f5fa); border-radius: 12px; padding: 4px; margin-bottom: 1.5rem;
    }
    .role-tab {
      flex: 1; text-align: center; padding: .55rem .5rem; border-radius: 9px; font-weight: 600; font-size: .85rem;
      color: #6b7280; cursor: pointer; user-select: none; transition: background .15s ease, color .15s ease;
    }
    .role-tab.active {
      background: #fff; color: #1f2430; box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
  </style>
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card animate-pop-in">
      <div class="auth-brand">
        <?!= include('Logo'); ?>
      </div>

      <div class="role-tabs">
        <div class="role-tab" id="tab-admin" data-role="Admin">Admin</div>
        <div class="role-tab" id="tab-manager" data-role="HubManager">Hub Manager</div>
      </div>

      <h5 class="fw-bold mb-1" id="login-heading">Admin Login</h5>
      <p class="text-muted small mb-4" id="login-subtext">Sign in with your administrator email and password.</p>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="login-email" required autofocus>
        </div>
        <div class="mb-2">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="login-password" required>
        </div>

        <div class="text-end mb-3">
          <button type="button" class="btn btn-link btn-sm p-0" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot password?</button>
        </div>

        <div class="alert alert-danger py-2 px-3 small d-none" id="login-error"></div>

        <button type="submit" class="btn btn-primary w-100" id="login-btn">Sign In</button>
      </form>

      <p class="text-muted small text-center mt-4 mb-0 d-none" id="manager-hint">
        Just received a welcome email? Use the link in that email to set your password first.
      </p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="forgot-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title">Reset Your Password</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="text-muted small">Enter your account email — if it matches an account, we'll send a link to reset your password.</p>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="forgot-email" required autofocus>
            </div>
            <div class="alert alert-success py-2 px-3 small d-none" id="forgot-result"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary" id="forgot-btn">Send Reset Link</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var WEB_APP_URL = '<?= webAppUrl ?>';
    var DEFAULT_ROLE = '<?= defaultRole ?>';
  </script>
  <?!= include('CoreJS'); ?>

  <script>
    var currentRole = DEFAULT_ROLE === 'HubManager' ? 'HubManager' : 'Admin';

    var COPY = {
      Admin: { heading: 'Admin Login', subtext: 'Sign in with your administrator email and password.', fn: 'adminLogin' },
      HubManager: { heading: 'Hub Manager Login', subtext: 'Sign in with the email and password set up for your account.', fn: 'managerLogin' }
    };

    function applyRole(role) {
      currentRole = role;
      document.getElementById('tab-admin').classList.toggle('active', role === 'Admin');
      document.getElementById('tab-manager').classList.toggle('active', role === 'HubManager');
      document.getElementById('login-heading').textContent = COPY[role].heading;
      document.getElementById('login-subtext').textContent = COPY[role].subtext;
      document.getElementById('manager-hint').classList.toggle('d-none', role !== 'HubManager');
      document.getElementById('login-error').classList.add('d-none');
    }

    document.getElementById('tab-admin').addEventListener('click', function () { applyRole('Admin'); });
    document.getElementById('tab-manager').addEventListener('click', function () { applyRole('HubManager'); });
    applyRole(currentRole);

    // Reads from this page's own iframe location — never window.top.location,
    // which is cross-origin here and not readable, only navigable.
    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('reason') === 'timeout') {
      setTimeout(function () {
        showToast('You were signed out after 5 minutes of inactivity.', 'info');
      }, 300);
    }

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();

      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;
      var btn = document.getElementById('login-btn');
      var errorBox = document.getElementById('login-error');
      errorBox.classList.add('d-none');

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      runServer(COPY[currentRole].fn, email, password).then(function (res) {
        if (!res.success) {
          btn.disabled = false;
          btn.textContent = 'Sign In';
          errorBox.textContent = res.message;
          errorBox.classList.remove('d-none');
          return;
        }
        localStorage.setItem('mne_session_token', res.data.sessionToken);
        goToTopUrl(WEB_APP_URL + '?page=dashboard');
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Sign In';
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
      });
    });

    document.getElementById('forgotPasswordModal').addEventListener('show.bs.modal', function () {
      document.getElementById('forgot-form').reset();
      document.getElementById('forgot-result').classList.add('d-none');
      document.getElementById('forgot-btn').classList.remove('d-none');
    });

    document.getElementById('forgot-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('forgot-email').value.trim();
      var btn = document.getElementById('forgot-btn');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      runServer('requestPasswordReset', email).then(function (res) {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
        var box = document.getElementById('forgot-result');
        box.textContent = res.success ? res.data.message : res.message;
        box.classList.remove('d-none');
        if (res.success) {
          document.getElementById('forgot-email').disabled = true;
          btn.classList.add('d-none');
        }
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
        var box = document.getElementById('forgot-result');
        box.classList.remove('alert-success');
        box.classList.add('alert-danger');
        box.textContent = err.message;
        box.classList.remove('d-none');
      });
    });
  </script>
</body>
</html>
