<script>
(function () {
  var sessionsState = { search: '', sortBy: 'Date', sortDir: 'desc', page: 1, pageSize: 10 };
  var recordSessionModal, attendanceModal;
  var currentSessionId = null;
  var attendanceRoster = {}; // BeneficiaryID -> { label, Present, Completed }

  document.addEventListener('page:loaded', function (e) {
    if (e.detail.page !== 'mytraining') return;
    if (!window.MNE_CURRENT_USER || window.MNE_CURRENT_USER.role !== 'HubManager') return;
    initMyTrainingPage();
  });

  function token() { return localStorage.getItem(MNE_SESSION_KEY); }

  function initMyTrainingPage() {
    sessionsState = { search: '', sortBy: 'Date', sortDir: 'desc', page: 1, pageSize: 10 };
    recordSessionModal = new bootstrap.Modal(document.getElementById('recordSessionModal'));
    attendanceModal = new bootstrap.Modal(document.getElementById('attendanceModal'));

    document.getElementById('btn-record-session').addEventListener('click', openRecordSessionModal);
    document.getElementById('session-form').addEventListener('submit', handleSaveSession);
    document.getElementById('btn-attendance-find').addEventListener('click', runAttendanceSearch);
    document.getElementById('attendance-save-btn').addEventListener('click', handleSaveAttendance);

    document.getElementById('sessions-search').addEventListener('input', debounce(function (e) {
      sessionsState.search = e.target.value; sessionsState.page = 1; fetchSessions();
    }, 350));

    fetchSessions();
  }

  function fetchSessions() {
    var tbody = document.getElementById('sessions-table-body');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Loading…</td></tr>';
    runServer('getMyHubTrainingSessions', token(), sessionsState).then(function (res) {
      if (!res.success) { tbody.innerHTML = '<tr><td colspan="7" class="text-danger text-center py-4">' + res.message + '</td></tr>'; return; }
      renderSessions(res.data.records);
      var p = res.data.pagination;
      var el = document.getElementById('sessions-summary');
      var start = (p.page - 1) * p.pageSize + 1;
      var end = Math.min(p.page * p.pageSize, p.totalRecords);
      el.textContent = p.totalRecords === 0 ? 'No records' : ('Showing ' + start + '–' + end + ' of ' + p.totalRecords);
      renderPagination('sessions-pagination', p, function (pg) { sessionsState.page = pg; fetchSessions(); });
    });
  }

  function renderSessions(records) {
    var tbody = document.getElementById('sessions-table-body');
    if (!records.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No training sessions recorded yet.</td></tr>'; return; }
    tbody.innerHTML = records.map(function (s) {
      return '<tr>' +
        '<td>' + escapeHtml(s.Date) + '</td>' +
        '<td class="fw-medium">' + escapeHtml(s.CourseName || '') + '</td>' +
        '<td>' + escapeHtml(s.TrainerName || '') + '</td>' +
        '<td>' + escapeHtml(s.StartTime) + '&ndash;' + escapeHtml(s.EndTime) + '</td>' +
        '<td>' + s.PresentCount + '</td>' +
        '<td>' + s.CompletedCount + '</td>' +
        '<td class="text-end"><button class="btn btn-sm btn-light" onclick="MyTraining.openAttendance(\'' + s.TrainingSessionID + '\')">Mark Attendance</button></td>' +
      '</tr>';
    }).join('');
  }

  function openRecordSessionModal() {
    document.getElementById('session-form').reset();
    document.getElementById('session-date').value = new Date().toISOString().slice(0, 10);
    runServer('getTrainingCourseOptions').then(function (res) {
      if (!res.success) { showToast(res.message, 'danger'); return; }
      document.getElementById('session-course').innerHTML = '<option value="">Select…</option>' +
        res.data.map(function (c) { return '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>'; }).join('');
      recordSessionModal.show();
    });
  }

  function handleSaveSession(e) {
    e.preventDefault();
    var form = document.getElementById('session-form');
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

    var data = {
      CourseID: document.getElementById('session-course').value,
      Date: document.getElementById('session-date').value,
      StartTime: document.getElementById('session-start').value,
      EndTime: document.getElementById('session-end').value,
      TrainerName: document.getElementById('session-trainer').value.trim(),
      PlannedParticipants: document.getElementById('session-planned').value,
      Notes: document.getElementById('session-notes').value.trim()
    };

    var btn = document.getElementById('session-save-btn');
    btn.disabled = true;
    runServer('recordTrainingSession', token(), data).then(function (res) {
      btn.disabled = false;
      if (!res.success) { showToast(res.message, 'danger'); return; }
      recordSessionModal.hide();
      showToast('Training session recorded.', 'success');
      fetchSessions();
    }).catch(function (err) { btn.disabled = false; showToast(err.message, 'danger'); });
  }

  function runAttendanceSearch() {
    var name = document.getElementById('attendance-search').value.trim();
    if (!name) return;
    var resultsEl = document.getElementById('attendance-search-results');
    resultsEl.innerHTML = '<p class="text-muted small">Searching…</p>';
    runServer('lookupBeneficiary', token(), { FirstName: name }).then(function (res) {
      if (!res.success) { resultsEl.innerHTML = '<p class="text-danger small">' + res.message + '</p>'; return; }
      if (!res.data.length) { resultsEl.innerHTML = '<p class="text-muted small">No matches.</p>'; return; }
      resultsEl.innerHTML = res.data.map(function (b) {
        var label = escapeHtml(b.FirstName + ' ' + b.SurnameInitial + '.');
        return '<div class="card-surface p-2 mb-1" style="cursor:pointer" onclick="MyTraining.addToRoster(\'' + b.BeneficiaryID + '\', \'' + label.replace(/'/g, "\\'") + '\')">' +
          label + ' — ' + escapeHtml(b.AgeGroup) + ', ' + escapeHtml(b.Gender) +
        '</div>';
      }).join('');
    });
  }

  function renderRoster() {
    var tbody = document.getElementById('attendance-list-body');
    var ids = Object.keys(attendanceRoster);
    if (!ids.length) { tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">No one added yet — search above.</td></tr>'; return; }
    tbody.innerHTML = ids.map(function (id) {
      var r = attendanceRoster[id];
      return '<tr>' +
        '<td>' + r.label + '</td>' +
        '<td class="text-center"><input type="checkbox" class="form-check-input" ' + (r.Present ? 'checked' : '') + ' onchange="MyTraining.toggleRoster(\'' + id + '\', \'Present\', this.checked)"></td>' +
        '<td class="text-center"><input type="checkbox" class="form-check-input" ' + (r.Completed ? 'checked' : '') + ' onchange="MyTraining.toggleRoster(\'' + id + '\', \'Completed\', this.checked)"></td>' +
        '<td class="text-end"><button class="btn btn-sm btn-light text-danger" onclick="MyTraining.removeFromRoster(\'' + id + '\')"><i class="bi bi-x"></i></button></td>' +
      '</tr>';
    }).join('');
  }

  function handleSaveAttendance() {
    var attendees = Object.keys(attendanceRoster).map(function (id) {
      return { BeneficiaryID: id, Present: attendanceRoster[id].Present, Completed: attendanceRoster[id].Completed };
    });
    var btn = document.getElementById('attendance-save-btn');
    btn.disabled = true;
    runServer('markAttendance', token(), currentSessionId, attendees).then(function (res) {
      btn.disabled = false;
      if (!res.success) { showToast(res.message, 'danger'); return; }
      attendanceModal.hide();
      showToast('Attendance saved.', 'success');
      fetchSessions();
    }).catch(function (err) { btn.disabled = false; showToast(err.message, 'danger'); });
  }

  window.MyTraining = {
    openAttendance: function (sessionId) {
      currentSessionId = sessionId;
      attendanceRoster = {};
      document.getElementById('attendance-search').value = '';
      document.getElementById('attendance-search-results').innerHTML = '';
      runServer('getSessionAttendance', token(), sessionId).then(function (res) {
        if (res.success) {
          res.data.forEach(function (a) {
            attendanceRoster[a.BeneficiaryID] = {
              label: escapeHtml(a.BeneficiaryFirstName || a.BeneficiaryID),
              Present: a.Present === true || a.Present === 'true',
              Completed: a.Completed === true || a.Completed === 'true'
            };
          });
        }
        renderRoster();
        attendanceModal.show();
      });
    },
    addToRoster: function (id, label) {
      if (!attendanceRoster[id]) attendanceRoster[id] = { label: label, Present: true, Completed: false };
      document.getElementById('attendance-search-results').innerHTML = '';
      document.getElementById('attendance-search').value = '';
      renderRoster();
    },
    toggleRoster: function (id, field, value) {
      if (attendanceRoster[id]) attendanceRoster[id][field] = value;
    },
    removeFromRoster: function (id) {
      delete attendanceRoster[id];
      renderRoster();
    }
  };
})();
</script>
