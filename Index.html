  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var token = localStorage.getItem('mne_session_token');
      if (!token) {
        goToTopUrl(WEB_APP_URL + '?page=login');
        return;
      }

      runServer('getIdentity', token).then(function (res) {
        if (!res.success) {
          localStorage.removeItem('mne_session_token');
          goToTopUrl(WEB_APP_URL + '?page=login', 'Your session has expired.');
          return;
        }
        applyIdentity(res.data);

        // Populated once here, before any page fragment loads, so every
        // page's formatCurrency() calls (CoreJS.html) already have it —
        // no per-page fetch needed. Defaults itself via getSystemCurrency
        // if this never resolves for some reason.
        window.MNE_CURRENCY = { code: 'KES', symbol: 'KSh' };
        runServer('getSystemCurrency', token).then(function (curRes) {
          if (curRes.success) window.MNE_CURRENCY = curRes.data;
        });

        // The URL's ?page= is almost always just 'dashboard' (that's what
        // Login.html's post-auth redirect always sets, and it never
        // changes as you navigate — see the comment in CommonJS.html's
        // loadPage()). If the URL explicitly points somewhere else (a
        // direct link/bookmark), honor that; otherwise resume wherever
        // this browser last was, so a refresh doesn't bounce you back to
        // Dashboard.
        var requestedPage = '<?= initialPage ?>';
        var lastPage = localStorage.getItem('mne_last_page');
        loadPage(requestedPage !== 'dashboard' ? requestedPage : (lastPage || requestedPage));
      }).catch(function () {
        localStorage.removeItem('mne_session_token');
        goToTopUrl(WEB_APP_URL + '?page=login', 'Your session has expired.');
      });
    });
  </script>
