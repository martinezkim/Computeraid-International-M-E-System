<div class="page-header animate-float-up">
  <div>
    <h4>My Projects</h4>
    <p id="manager-hub-label">Loading your hub…</p>
  </div>
  <button class="btn btn-primary" id="btn-add-project">
    <i class="bi bi-plus-lg"></i> Add Project
  </button>
</div>

<div class="card-surface animate-float-up">
  <div class="toolbar mb-3">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" class="form-control" id="my-project-search" placeholder="Search projects…">
    </div>

    <select class="form-select w-auto" id="my-project-quota-filter">
      <option value="">All Reporting Quotas</option>
    </select>

    <select class="form-select w-auto" id="my-project-sort">
      <option value="ProjectDate:desc">Date (Newest)</option>
      <option value="ProjectDate:asc">Date (Oldest)</option>
      <option value="ProjectName:asc">Name (A–Z)</option>
      <option value="Cost:desc">Cost (Highest)</option>
      <option value="TotalNewBeneficiaries:desc">Beneficiaries (Highest)</option>
    </select>

    <select class="form-select w-auto" id="my-project-page-size">
      <option value="10">10 / page</option>
      <option value="25">25 / page</option>
      <option value="50">50 / page</option>
    </select>
  </div>

  <div class="project-grid" id="my-projects-grid">
    <div class="text-center text-muted py-4" style="grid-column: 1 / -1;">Loading…</div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3">
    <small class="text-muted" id="my-projects-summary"></small>
    <div id="my-projects-pagination"></div>
  </div>
</div>

<!-- Add Project Modal -->
<div class="modal fade" id="addProjectModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Project</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="add-project-form" novalidate>
          <div class="mb-3">
            <label class="form-label">Project Name</label>
            <input type="text" class="form-control" id="field-ProjectName" placeholder="e.g. Girls in STEM Bootcamp">
          </div>
          <div class="mb-3">
            <label class="form-label">Cost</label>
            <div class="input-group">
              <span class="input-group-text" id="field-cost-symbol">KSh</span>
              <input type="number" min="0" step="0.01" class="form-control" id="field-Cost" placeholder="0.00">
            </div>
          </div>
          <div class="form-text">
            The reporting quarter and dates are set automatically the moment you activate this project — nothing else to fill in here.
          </div>
          <div class="alert alert-danger py-2 px-3 small d-none mt-3" id="add-project-error"></div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="add-project-submit-btn">Add Project</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="projectDeleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Delete Project</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete <strong id="delete-project-name"></strong>? This cannot be undone.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-delete-project">Delete</button>
      </div>
    </div>
  </div>
</div>
