<div class="page-header">
  <div>
    <h4>Training</h4>
    <p>Record training sessions and mark attendance</p>
  </div>
  <button class="btn btn-primary" id="btn-record-session"><i class="bi bi-mortarboard"></i> Record Session</button>
</div>

<div class="card-surface">
  <div class="toolbar mb-3">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" class="form-control" id="sessions-search" placeholder="Search by trainer or notes…">
    </div>
  </div>
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>Date</th><th>Course</th><th>Trainer</th><th>Time</th><th>Present</th><th>Completed</th><th class="text-end">Action</th></tr></thead>
      <tbody id="sessions-table-body"><tr><td colspan="7" class="text-center text-muted py-4">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="d-flex justify-content-between align-items-center mt-2">
    <small class="text-muted" id="sessions-summary"></small>
    <div id="sessions-pagination"></div>
  </div>
</div>

<!-- Record Session Modal -->
<div class="modal fade" id="recordSessionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="session-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Record Training Session</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Course</label>
            <select class="form-select" id="session-course" required></select>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="session-date" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">Start</label>
              <input type="time" class="form-control" id="session-start" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">End</label>
              <input type="time" class="form-control" id="session-end" required>
            </div>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Trainer Name</label>
              <input type="text" class="form-control" id="session-trainer" maxlength="100">
            </div>
            <div class="col mb-3">
              <label class="form-label">Planned Participants</label>
              <input type="number" class="form-control" id="session-planned" min="0">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Notes <span class="text-muted">(optional)</span></label>
            <textarea class="form-control" id="session-notes" maxlength="500" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="session-save-btn">Save Session</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Mark Attendance Modal -->
<div class="modal fade" id="attendanceModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Mark Attendance</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <div class="input-group">
            <input type="text" class="form-control" id="attendance-search" placeholder="Search beneficiary by first name…">
            <button type="button" class="btn btn-light" id="btn-attendance-find">Search</button>
          </div>
          <div id="attendance-search-results" class="mt-2"></div>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Beneficiary</th><th class="text-center">Present</th><th class="text-center">Completed</th><th></th></tr></thead>
            <tbody id="attendance-list-body"><tr><td colspan="4" class="text-center text-muted py-3">No one added yet — search above.</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="attendance-save-btn">Save Attendance</button>
      </div>
    </div>
  </div>
</div>
