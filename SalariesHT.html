<div class="page-header">
  <div>
    <h4>Salaries</h4>
    <p>Admin-only — individual salary rows are never sent to a Hub Manager. They see only their hub's aggregated staff cost on the Finance page.</p>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary" id="btn-add-salary"><i class="bi bi-plus-lg"></i> Add Salary Record</button>
  </div>
</div>

<div class="card-surface">
  <div class="toolbar mb-3">
    <select class="form-select w-auto" id="salaries-hub-filter"><option value="">All Hubs</option></select>
    <input type="month" class="form-control w-auto" id="salaries-month-filter">
    <button class="btn btn-light btn-sm" id="btn-clear-month-filter">Clear Month</button>
  </div>
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>Staff</th><th>Hub</th><th>Month</th><th class="text-end">Net Cost</th><th>Status</th><th>Payment</th></tr></thead>
      <tbody id="salaries-table-body"><tr><td colspan="6" class="text-center text-muted py-4">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="d-flex justify-content-between align-items-center mt-2">
    <small class="text-muted" id="salaries-summary"></small>
    <div id="salaries-pagination"></div>
  </div>
</div>

<!-- Add Salary Modal -->
<div class="modal fade" id="salaryModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="salary-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Add Salary Record</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Staff</label>
              <select class="form-select" id="salary-staffid" required></select>
            </div>
            <div class="col mb-3">
              <label class="form-label">Month</label>
              <input type="month" class="form-control" id="salary-month" required>
            </div>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Hub</label>
              <select class="form-select" id="salary-hubid" required></select>
            </div>
            <div class="col mb-3">
              <label class="form-label">Project <span class="text-muted">(optional)</span></label>
              <select class="form-select" id="salary-projectid"><option value="">— None —</option></select>
            </div>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Gross Amount</label>
              <input type="number" class="form-control" id="salary-grossamount" min="0" step="0.01" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">Allowances <span class="text-muted">(optional)</span></label>
              <input type="number" class="form-control" id="salary-allowances" min="0" step="0.01">
            </div>
            <div class="col mb-3">
              <label class="form-label">Deductions <span class="text-muted">(optional)</span></label>
              <input type="number" class="form-control" id="salary-deductions" min="0" step="0.01">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Account</label>
            <select class="form-select" id="salary-accountid" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Payroll Document <span class="text-muted">(optional)</span></label>
            <input type="file" class="form-control" id="salary-document-input" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls">
            <div id="salary-document-status" class="mt-1"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="salary-save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal fade" id="salaryDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Salary Record</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="salarydetail-fields" class="bendetail-grid"></div>
      </div>
      <div class="modal-footer flex-wrap gap-2" id="salarydetail-actions"></div>
    </div>
  </div>
</div>

<!-- Cancel Modal -->
<div class="modal fade" id="salaryCancelModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Cancel Salary Record</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <textarea class="form-control" id="salary-cancel-reason" maxlength="500" rows="2" placeholder="Reason…"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Back</button>
        <button type="button" class="btn btn-danger" id="confirm-salary-cancel">Confirm Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- Mark Paid Modal -->
<div class="modal fade" id="salaryPaidModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Mark Paid</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Payment Date</label>
          <input type="date" class="form-control" id="salary-payment-date">
        </div>
        <div class="mb-3">
          <label class="form-label">Payment Reference <span class="text-muted">(optional)</span></label>
          <input type="text" class="form-control" id="salary-payment-reference" maxlength="80">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirm-salary-paid">Mark Paid</button>
      </div>
    </div>
  </div>
</div>
