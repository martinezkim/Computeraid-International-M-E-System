<div class="page-header animate-float-up">
  <div>
    <h4>All Inventory</h4>
    <p>Hub equipment and laptop stock across every hub</p>
  </div>
  <button class="btn btn-light" id="btn-open-export">
    <i class="bi bi-download"></i> Export
  </button>
</div>

<div class="toolbar mb-3 animate-float-up">
  <select class="form-select w-auto" id="admin-inv-country-filter">
    <option value="">All Countries</option>
  </select>
  <select class="form-select w-auto" id="admin-inv-scope-hub-filter">
    <option value="">All Hubs</option>
  </select>
</div>

<div class="row g-3 mb-3 row-cols-2 row-cols-md-4 animate-float-up">
  <div class="col">
    <div class="detail-stat">
      <div class="detail-stat-value" id="admin-inv-hubcount">–</div>
      <div class="detail-stat-label">Hubs</div>
    </div>
  </div>
  <div class="col">
    <div class="detail-stat">
      <div class="detail-stat-value" id="admin-inv-totalassets">–</div>
      <div class="detail-stat-label">Total Assets</div>
    </div>
  </div>
  <div class="col">
    <div class="detail-stat">
      <div class="detail-stat-value" id="admin-inv-laptopstock">–</div>
      <div class="detail-stat-label">Laptops in Stock</div>
    </div>
  </div>
  <div class="col">
    <div class="detail-stat">
      <div class="detail-stat-value" id="admin-inv-laptopsold">–</div>
      <div class="detail-stat-label">Laptops Sold</div>
    </div>
  </div>
</div>

<!-- Export Modal -->
<div class="modal fade" id="inventoryExportModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Export Inventory Data</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">What to export</label>
          <select class="form-select" id="export-report-type">
            <option value="hubInventory">Hub Inventory</option>
            <option value="laptopCurrentStock">Laptop Current Stock</option>
            <option value="laptopSold">Sold Laptops</option>
            <option value="laptopFaulty">Faulty Laptops</option>
            <option value="complete">Complete Inventory (Hub + Laptops)</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Hub</label>
          <select class="form-select" id="export-hub-filter">
            <option value="">All Hubs</option>
          </select>
        </div>
        <div class="mb-1">
          <label class="form-label">Format</label>
          <select class="form-select" id="export-format">
            <option value="xlsx">Excel (.xlsx)</option>
            <option value="csv">CSV</option>
            <option value="pdf">PDF (print)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-run-export">
          <i class="bi bi-download"></i> Export
        </button>
      </div>
    </div>
  </div>
</div>
