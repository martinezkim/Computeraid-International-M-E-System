<div class="page-header animate-float-up">
  <div>
    <h4>Audit Log</h4>
    <p>Who changed what, and when — Inventory and Laptops for Sale</p>
  </div>
</div>

<div class="card-surface animate-float-up">
  <div class="toolbar mb-3">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" class="form-control" id="audit-search" placeholder="Search by actor, record ID, field…">
    </div>

    <select class="form-select w-auto" id="audit-table-filter">
      <option value="">All Tables</option>
      <option value="Inventory">Inventory</option>
      <option value="Laptops">Laptops</option>
    </select>

    <select class="form-select w-auto" id="audit-action-filter">
      <option value="">All Actions</option>
      <option value="Create">Create</option>
      <option value="Update">Update</option>
      <option value="Delete">Delete</option>
    </select>

    <select class="form-select w-auto" id="audit-country-filter">
      <option value="">All Countries</option>
    </select>

    <select class="form-select w-auto" id="audit-hub-filter">
      <option value="">All Hubs</option>
    </select>

    <select class="form-select w-auto" id="audit-page-size">
      <option value="25">25 / page</option>
      <option value="50">50 / page</option>
      <option value="100">100 / page</option>
    </select>
  </div>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
        <tr>
          <th>When</th>
          <th>Who</th>
          <th>Action</th>
          <th>Table</th>
          <th>Record</th>
          <th>Field</th>
          <th>Old Value</th>
          <th>New Value</th>
        </tr>
      </thead>
      <tbody id="audit-table-body">
        <tr><td colspan="8" class="text-center text-muted py-4">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-2">
    <small class="text-muted" id="audit-summary"></small>
    <div id="audit-pagination"></div>
  </div>
</div>
