<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Your Password</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <?!= include('Styles'); ?>
  <style>
    .auth-shell {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #1c2340, #12172b 65%); padding: 1.5rem;
    }
    .auth-card {
      width: 100%; max-width: 420px; background: #fff; border-radius: 18px;
      padding: 2.25rem 2rem; box-shadow: 0 24px 48px -12px rgba(0,0,0,.45);
    }
    .auth-brand {
      display: flex; align-items: center; margin-bottom: 1.75rem;
      background: var(--sidebar-bg, #12172b);
      border-radius: 12px;
      padding: 1rem 1.25rem;
    }
    .auth-brand .brand-logo-svg { width: 170px; height: auto; display: block; }
  </style>
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card animate-pop-in">
      <div class="auth-brand">
        <?!= include('Logo'); ?>
      </div>

      <h5 class="fw-bold mb-1">Set Your Password</h5>
      <p class="text-muted small mb-4">Welcome! Choose a password to secure your account.</p>

      <div id="token-checking" class="text-center text-muted py-3">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div> Verifying your link…
      </div>

      <form id="reset-form" class="d-none" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="reset-email" disabled>
        </div>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" class="form-control" id="reset-password" required minlength="8">
          <div class="form-text">At least 8 characters.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="reset-password-confirm" required minlength="8">
        </div>

        <div class="alert alert-danger py-2 px-3 small d-none" id="reset-error"></div>

        <button type="submit" class="btn btn-primary w-100" id="reset-btn">Set Password &amp; Continue</button>
      </form>

      <div id="token-invalid" class="d-none text-center py-3">
        <i class="bi bi-x-circle text-danger" style="font-size: 2rem;"></i>
        <p class="text-muted mt-2 mb-0" id="token-invalid-message">This link is invalid or has expired.</p>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var WEB_APP_URL = '<?= webAppUrl ?>';
    var PRESET_EMAIL = '<?= presetEmail ?>';
    var PRESET_TOKEN = '<?= presetToken ?>';
  </script>
  <?!= include('CoreJS'); ?>

  <script>
    function showInvalid(message) {
      document.getElementById('token-checking').classList.add('d-none');
      document.getElementById('token-invalid-message').textContent = message;
      document.getElementById('token-invalid').classList.remove('d-none');
    }

    (function verifyLink() {
      if (!PRESET_EMAIL || !PRESET_TOKEN) {
        showInvalid('This link is missing information. Please use the exact link from your email.');
        return;
      }
      runServer('validateResetToken', PRESET_EMAIL, PRESET_TOKEN).then(function (res) {
        document.getElementById('token-checking').classList.add('d-none');
        if (!res.success) {
          showInvalid(res.message);
          return;
        }
        document.getElementById('reset-email').value = res.data.email;
        document.getElementById('reset-form').classList.remove('d-none');
      }).catch(function (err) {
        showInvalid(err.message);
      });
    })();

    document.getElementById('reset-form').addEventListener('submit', function (e) {
      e.preventDefault();

      var pwd = document.getElementById('reset-password').value;
      var confirmPwd = document.getElementById('reset-password-confirm').value;
      var errorBox = document.getElementById('reset-error');
      errorBox.classList.add('d-none');

      if (pwd !== confirmPwd) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.classList.remove('d-none');
        return;
      }

      var btn = document.getElementById('reset-btn');
      btn.disabled = true;
      btn.textContent = 'Setting password…';

      runServer('resetAccountPassword', PRESET_EMAIL, PRESET_TOKEN, pwd).then(function (res) {
        if (!res.success) {
          btn.disabled = false;
          btn.textContent = 'Set Password & Continue';
          errorBox.textContent = res.message;
          errorBox.classList.remove('d-none');
          return;
        }

        // Auto-login: the server already issued a session, so store it
        // and go straight to the dashboard — no separate login step.
        localStorage.setItem('mne_session_token', res.data.sessionToken);
        showToast('Password set! Taking you to your dashboard…', 'success');
        setTimeout(function () {
          goToTopUrl(WEB_APP_URL + '?page=dashboard');
        }, 900);
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Set Password & Continue';
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
      });
    });
  </script>
</body>
</html>
