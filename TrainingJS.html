<script>
(function () {
  var sessionsState = { search: '', hubId: '', sortBy: 'Date', sortDir: 'desc', page: 1, pageSize: 10 };

  var EXPORT_COLUMNS = [
    { key: 'Date', label: 'Date' }, { key: 'HubName', label: 'Hub' }, { key: 'CourseName', label: 'Course' },
    { key: 'TrainerName', label: 'Trainer' }, { key: 'StartTime', label: 'Start' }, { key: 'EndTime', label: 'End' },
    { key: 'PresentCount', label: 'Present' }, { key: 'CompletedCount', label: 'Completed' }
  ];

  document.addEventListener('page:loaded', function (e) {
    if (e.detail.page !== 'training') return;
    if (!window.MNE_CURRENT_USER || window.MNE_CURRENT_USER.role !== 'Admin') return;
    initTrainingPage();
  });

  function token() { return localStorage.getItem(MNE_SESSION_KEY); }

  function initTrainingPage() {
    sessionsState = { search: '', hubId: '', sortBy: 'Date', sortDir: 'desc', page: 1, pageSize: 10 };

    document.getElementById('sessions-search').addEventListener('input', debounce(function (e) {
      sessionsState.search = e.target.value; sessionsState.page = 1; fetchSessions();
    }, 350));
    document.getElementById('sessions-hub-filter').addEventListener('change', function (e) {
      sessionsState.hubId = e.target.value; sessionsState.page = 1; fetchSessions();
    });
    document.querySelectorAll('[data-format]').forEach(function (link) {
      link.addEventListener('click', function (e) { e.preventDefault(); runExport(link.dataset.format); });
    });

    loadHubOptions().then(fetchSessions);
  }

  function loadHubOptions() {
    return runServer('getHubOptions').then(function (res) {
      if (!res.success) return;
      document.getElementById('sessions-hub-filter').innerHTML = '<option value="">All Hubs</option>' +
        res.data.map(function (h) { return '<option value="' + h.id + '">' + escapeHtml(h.name) + '</option>'; }).join('');
    });
  }

  function fetchSessions() {
    var tbody = document.getElementById('sessions-table-body');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Loading…</td></tr>';
    runServer('getAllTrainingSessions', token(), sessionsState).then(function (res) {
      if (!res.success) { tbody.innerHTML = '<tr><td colspan="7" class="text-danger text-center py-4">' + res.message + '</td></tr>'; return; }
      renderSessions(res.data.records);
      var p = res.data.pagination;
      var el = document.getElementById('sessions-summary');
      var start = (p.page - 1) * p.pageSize + 1;
      var end = Math.min(p.page * p.pageSize, p.totalRecords);
      el.textContent = p.totalRecords === 0 ? 'No records' : ('Showing ' + start + '–' + end + ' of ' + p.totalRecords);
      renderPagination('sessions-pagination', p, function (pg) { sessionsState.page = pg; fetchSessions(); });
    });
  }

  function renderSessions(records) {
    var tbody = document.getElementById('sessions-table-body');
    if (!records.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No training sessions found.</td></tr>'; return; }
    tbody.innerHTML = records.map(function (s) {
      return '<tr>' +
        '<td>' + escapeHtml(s.Date) + '</td>' +
        '<td>' + escapeHtml(s.HubName || '') + '</td>' +
        '<td class="fw-medium">' + escapeHtml(s.CourseName || '') + '</td>' +
        '<td>' + escapeHtml(s.TrainerName || '') + '</td>' +
        '<td>' + escapeHtml(s.StartTime) + '&ndash;' + escapeHtml(s.EndTime) + '</td>' +
        '<td>' + s.PresentCount + '</td>' +
        '<td>' + s.CompletedCount + '</td>' +
      '</tr>';
    }).join('');
  }

  function runExport(format) {
    runServer('getAllTrainingSessions', token(), { search: sessionsState.search, hubId: sessionsState.hubId, page: 1, pageSize: 100000 }).then(function (res) {
      if (!res.success) { showToast(res.message, 'danger'); return; }
      exportRecordsToFile(res.data.records, EXPORT_COLUMNS, format, 'TrainingSessions_' + new Date().toISOString().slice(0, 10));
    });
  }
})();
</script>
