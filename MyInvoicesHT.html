<div class="page-header">
  <div>
    <h4>Invoices</h4>
    <p>Submit invoices for your hub and track their approval status</p>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary" id="btn-add-invoice"><i class="bi bi-plus-lg"></i> Submit Invoice</button>
  </div>
</div>

<div class="card-surface">
  <div class="table-responsive">
    <table class="table align-middle">
      <thead><tr><th>Invoice #</th><th>Supplier</th><th>Category</th><th class="text-end">Amount</th><th>Submitted</th><th>Status</th><th>Payment</th><th class="text-end">Actions</th></tr></thead>
      <tbody id="myinvoices-table-body"><tr><td colspan="8" class="text-center text-muted py-4">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="d-flex justify-content-between align-items-center mt-2">
    <small class="text-muted" id="myinvoices-summary"></small>
    <div id="myinvoices-pagination"></div>
  </div>
</div>

<!-- Submit / Resubmit Invoice Modal -->
<div class="modal fade" id="myInvoiceModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="myinvoice-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="myInvoiceModalLabel">Submit Invoice</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="myinvoice-id">
          <div id="myinvoice-return-banner"></div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Supplier Name</label>
              <input type="text" class="form-control" id="myinvoice-suppliername" required maxlength="150">
            </div>
            <div class="col mb-3">
              <label class="form-label">Invoice Number <span class="text-muted">(optional)</span></label>
              <input type="text" class="form-control" id="myinvoice-invoicenumber" maxlength="60">
            </div>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Supplier Contact <span class="text-muted">(optional)</span></label>
              <input type="text" class="form-control" id="myinvoice-suppliercontact" maxlength="100">
            </div>
            <div class="col mb-3">
              <label class="form-label">Supplier's Own Reference <span class="text-muted">(optional)</span></label>
              <input type="text" class="form-control" id="myinvoice-supplierref" maxlength="80">
            </div>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Invoice Date</label>
              <input type="date" class="form-control" id="myinvoice-invoicedate" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">Expense Category</label>
              <select class="form-select" id="myinvoice-category" required></select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Project <span class="text-muted">(optional)</span></label>
            <select class="form-select" id="myinvoice-projectid"><option value="">— None —</option></select>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Amount</label>
              <input type="number" class="form-control" id="myinvoice-amount" min="0" step="0.01" required>
            </div>
            <div class="col mb-3">
              <label class="form-label">Tax Amount <span class="text-muted">(optional)</span></label>
              <input type="number" class="form-control" id="myinvoice-taxamount" min="0" step="0.01">
            </div>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label">Account</label>
              <select class="form-select" id="myinvoice-accountid" required></select>
            </div>
            <div class="col mb-3">
              <label class="form-label">Payment Method <span class="text-muted">(optional)</span></label>
              <select class="form-select" id="myinvoice-paymentmethod">
                <option value="">— Not specified —</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Mobile Money">Mobile Money</option>
                <option value="Cash">Cash</option>
                <option value="Cheque">Cheque</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Description <span class="text-muted">(optional)</span></label>
            <textarea class="form-control" id="myinvoice-description" maxlength="500" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Invoice Document <span class="text-muted">(optional)</span></label>
            <input type="file" class="form-control" id="myinvoice-document-input" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls">
            <div id="myinvoice-document-status" class="mt-1"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Notes <span class="text-muted">(optional)</span></label>
            <textarea class="form-control" id="myinvoice-notes" maxlength="500" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="myinvoice-save-btn">Submit Invoice</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- View Invoice Modal -->
<div class="modal fade" id="myInvoiceViewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Invoice Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="myinvoice-view-reason-banner"></div>
        <div id="myinvoice-view-fields" class="bendetail-grid"></div>
      </div>
      <div class="modal-footer flex-wrap gap-2" id="myinvoice-view-actions"></div>
    </div>
  </div>
</div>

<!-- Cancel Confirmation Modal -->
<div class="modal fade" id="myInvoiceCancelModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Cancel Invoice</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure? This cannot be undone.</p>
        <textarea class="form-control" id="myinvoice-cancel-reason" maxlength="500" rows="2" placeholder="Reason…"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Back</button>
        <button type="button" class="btn btn-danger" id="confirm-myinvoice-cancel">Cancel Invoice</button>
      </div>
    </div>
  </div>
</div>
