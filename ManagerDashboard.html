<div class="page-header animate-float-up">
  <div>
    <h4>Dashboard</h4>
    <p id="manager-hub-label">Loading your hub…</p>
  </div>
</div>

<div class="stat-grid stat-grid-3">

  <div class="stat-tile animate-float-up" style="animation-delay:.05s; background: linear-gradient(135deg,#b8790a,#e0ac1f);">
    <span class="stat-icon"><i class="bi bi-people-fill"></i></span>
    <div>
      <div class="stat-value" id="stat-my-total-beneficiaries">0</div>
      <div class="stat-label">Active Users <span id="stat-my-beneficiaries-year" class="stat-year-tag"></span></div>
    </div>
    <div class="stat-glow"></div>
  </div>

  <div class="stat-tile animate-float-up" style="animation-delay:.12s; background: linear-gradient(135deg,#1c2340,#3b4570);">
    <span class="stat-icon"><i class="bi bi-kanban-fill"></i></span>
    <div>
      <div class="stat-value" id="stat-my-total-projects">0</div>
      <div class="stat-label">Total Projects <span id="stat-my-projects-year" class="stat-year-tag"></span></div>
    </div>
    <div class="stat-glow"></div>
  </div>

  <div class="stat-tile animate-float-up" style="animation-delay:.19s; background: linear-gradient(135deg,#feca38,#ffdd6b);">
    <span class="stat-icon"><i class="bi bi-cash-coin"></i></span>
    <div>
      <div class="stat-value" id="stat-my-total-cost">$0</div>
      <div class="stat-label">Money Spent <span id="stat-my-cost-year" class="stat-year-tag"></span></div>
    </div>
    <div class="stat-glow"></div>
  </div>

</div>
